<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Введення імені</title>
</head>
<body>

<h1>Введіть ваше ім'я</h1>
<input type="text" id="username">

<script>
const input = document.getElementById('username');

input.addEventListener('input', () => {
  // Заміняємо всі цифри на порожній рядок
  input.value = input.value.replace(/\d/g, '');
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Модальне вікно</title>
  <style>
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<button id="openModalBtn">Відкрити</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <p>Це модальне вікно</p>
    <button id="closeModalBtn">Закрити</button>
  </div>
</div>

<script>
const openModalBtn = document.getElementById('openModalBtn');
const closeModalBtn = document.getElementById('closeModalBtn');
const modal = document.getElementById('modal');

openModalBtn.addEventListener('click', () => {
  modal.style.display = 'flex';
});

closeModalBtn.addEventListener('click', () => {
  modal.style.display = 'none';
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Футбольне поле</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #field {
      width: 100%;
      height: 100%;
      background: green;
      position: relative;
    }
    #ball {
      width: 100px;
      height: 100px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: url('https://upload.wikimedia.org/wikipedia/commons/6/6e/Soccer_ball.svg') no-repeat center;
      background-size: cover;
      transition: all 0.5s ease;
    }
  </style>
</head>
<body>

<div id="field">
  <div id="ball"></div>
</div>

<script>
const field = document.getElementById('field');
const ball = document.getElementById('ball');

field.addEventListener('click', function(event) {
  const fieldRect = field.getBoundingClientRect();
  let x = event.clientX - fieldRect.left;
  let y = event.clientY - fieldRect.top;

  // Зміщення центру м'яча
  x -= ball.offsetWidth / 2;
  y -= ball.offsetHeight / 2;

  // Обмеження, щоб м'яч не виходив за межі поля
  const maxX = field.clientWidth - ball.offsetWidth;
  const maxY = field.clientHeight - ball.offsetHeight;

  x = Math.max(0, Math.min(x, maxX));
  y = Math.max(0, Math.min(y, maxY));

  ball.style.left = `${x}px`;
  ball.style.top = `${y}px`;
});
</script>

</body>
</html>
