<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Пости з пагінацією</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 600px; margin: auto; }
    .post { border-bottom: 1px solid #ccc; padding: 10px 0; }
    .pagination { margin-top: 20px; }
    .pagination button { margin-right: 5px; }
    input[type="text"] { width: 100%; padding: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <h2>Список постів</h2>
  <input type="text" id="searchInput" placeholder="Пошук за заголовком..." />

  <div id="posts"></div>
  <div class="pagination">
    <button onclick="prevPage()">⬅️ Попередня</button>
    <span id="pageNum">Сторінка: 1</span>
    <button onclick="nextPage()">Наступна ➡️</button>
  </div>

  <script>
    let currentPage = 1;
    const limit = 10;
    let searchTerm = "";
    let controller = null;

    const postsDiv = document.getElementById("posts");
    const pageNum = document.getElementById("pageNum");
    const searchInput = document.getElementById("searchInput");

    async function fetchPosts(page = 1, search = "") {
      if (controller) controller.abort(); // Скасування попереднього запиту

      controller = new AbortController();
      const signal = controller.signal;

      const url = `https://jsonplaceholder.typicode.com/posts?_page=${page}&_limit=${limit}`;
      
      try {
        const res = await fetch(url, { signal });
        const posts = await res.json();

        const filtered = search
          ? posts.filter(p => p.title.toLowerCase().includes(search.toLowerCase()))
          : posts;

        renderPosts(filtered);
        pageNum.textContent = `Сторінка: ${page}`;
      } catch (err) {
        if (err.name === "AbortError") {
          console.log("Запит скасовано");
        } else {
          console.error("Помилка завантаження:", err);
        }
      }
    }

    function renderPosts(posts) {
      postsDiv.innerHTML = posts.length
        ? posts.map(p => `<div class="post"><strong>${p.title}</strong><p>${p.body}</p></div>`).join("")
        : "<p>Нічого не знайдено.</p>";
    }

    function nextPage() {
      currentPage++;
      fetchPosts(currentPage, searchTerm);
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        fetchPosts(currentPage, searchTerm);
      }
    }

    // Дебаунс функція
    function debounce(fn, delay) {
      let timer;
      return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    const onSearch = debounce((e) => {
      searchTerm = e.target.value;
      currentPage = 1;
      fetchPosts(currentPage, searchTerm);
    }, 500);

    searchInput.addEventListener("input", onSearch);

    // Початкове завантаження
    fetchPosts();
  </script>
</body>
</html>
