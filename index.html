<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Star Wars Characters</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        #filter {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            max-width: 400px;
            font-size: 16px;
        }
        .characters {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 200px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card h3 {
            margin: 10px;
            font-size: 18px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            border-radius: 10px;
            position: relative;
        }
        .modal-content img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .close {
            position: absolute;
            right: 10px;
            top: 10px;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Персонажі Star Wars</h1>

<input type="text" id="filter" placeholder="Пошук за ім'ям чи властивістю...">

<div class="characters" id="charactersContainer"></div>

<div class="modal" id="modal">
    <div class="modal-content" id="modalContent">
        <span class="close" id="closeModal">&times;</span>
    </div>
</div>

<script>
const charactersContainer = document.getElementById('charactersContainer');
const filterInput = document.getElementById('filter');
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modalContent');
const closeModal = document.getElementById('closeModal');

let characters = []; 

fetch('https://akabab.github.io/starwars-api/api/all.json')
    .then(response => response.json())
    .then(data => {
        characters = data;
        renderCharacters(characters);
    })
    .catch(error => console.error('Помилка завантаження:', error));

function renderCharacters(list) {
    charactersContainer.innerHTML = '';
    list.forEach(character => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <img src="${character.image}" alt="${character.name}">
            <h3>${character.name}</h3>
        `;
        card.addEventListener('click', () => showModal(character));
        charactersContainer.appendChild(card);
    });
}

function showModal(character) {
    modalContent.innerHTML = `
        <span class="close" id="closeModal">&times;</span>
        <img src="${character.image}" alt="${character.name}">
        <h2>${character.name}</h2>
        <p><strong>Species:</strong> ${character.species || 'Невідомо'}</p>
        <p><strong>Gender:</strong> ${character.gender || 'Невідомо'}</p>
        <p><strong>Height:</strong> ${character.height || 'Невідомо'} см</p>
        <p><strong>Homeworld:</strong> ${character.homeworld || 'Невідомо'}</p>
    `;
    modal.style.display = 'flex';

    document.getElementById('closeModal').onclick = () => {
        modal.style.display = 'none';
    };
}

modal.onclick = function(event) {
    if (event.target === modal) {
        modal.style.display = 'none';
    }
}
filterInput.addEventListener('input', function() {
    const searchTerm = this.value.toLowerCase();
    const filtered = characters.filter(character => {
        return Object.values(character).some(value => 
            String(value).toLowerCase().includes(searchTerm)
        );
    });
    renderCharacters(filtered);
});
</script>

</body>
</html>
