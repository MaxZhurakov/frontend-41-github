<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Форма реєстрації</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
    }
    .hidden {
      display: none;
    }
    .error {
      color: red;
      margin-top: -8px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>Форма реєстрації</h2>
  <form id="registrationForm">
    <label>ПІБ:
      <input type="text" id="fullName" required />
    </label>

    <label>Email:
      <input type="email" id="email" required />
    </label>

    <label>Телефон:
      <input type="tel" id="phone" required />
    </label>

    <label>Захід:
      <input type="text" id="event" required />
    </label>

    <label>Дата народження:
      <input type="date" id="birthdate" required />
    </label>
    <div id="ageError" class="error hidden">Вам має бути не менше 18 років.</div>

    <label>Посада/Роль:
      <input type="text" id="role" required />
    </label>

    <label>Чи відвідували ви раніше наші заходи?</label>
    <label><input type="radio" name="visited" value="yes" /> Так</label>
    <label><input type="radio" name="visited" value="no" /> Ні</label>

    <div id="previousEventBlock" class="hidden">
      <label>Назвіть захід, який ви відвідували:
        <input type="text" id="previousEvent" />
      </label>
      <div id="eventError" class="error hidden">Це поле обов'язкове.</div>
    </div>

    <button type="submit">Надіслати</button>
  </form>

  <script>
    const form = document.getElementById("registrationForm");
    const birthdate = document.getElementById("birthdate");
    const ageError = document.getElementById("ageError");
    const visitedRadios = document.getElementsByName("visited");
    const previousEventBlock = document.getElementById("previousEventBlock");
    const previousEventInput = document.getElementById("previousEvent");
    const eventError = document.getElementById("eventError");

    visitedRadios.forEach(radio => {
      radio.addEventListener("change", () => {
        if (radio.value === "yes") {
          previousEventBlock.classList.remove("hidden");
        } else {
          previousEventBlock.classList.add("hidden");
          previousEventInput.value = "";
        }
      });
    });

    function isAdult(birthdate) {
      const today = new Date();
      const birth = new Date(birthdate);
      const age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      return age > 18 || (age === 18 && m >= 0 && today.getDate() >= birth.getDate());
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      ageError.classList.add("hidden");
      eventError.classList.add("hidden");

      const selectedVisited = Array.from(visitedRadios).find(r => r.checked)?.value || "";
      const isVisited = selectedVisited === "yes";

      if (!isAdult(birthdate.value)) {
        ageError.classList.remove("hidden");
        return;
      }

      if (isVisited && previousEventInput.value.trim() === "") {
        eventError.classList.remove("hidden");
        return;
      }

      const data = {
        fullName: document.getElementById("fullName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        event: document.getElementById("event").value.trim(),
        birthdate: birthdate.value,
        role: document.getElementById("role").value.trim(),
        visitedBefore: selectedVisited,
        previousEvent: isVisited ? previousEventInput.value.trim() : ""
      };

      console.log(data);
      alert("Дані успішно надіслані! Перевірте консоль.");
      form.reset();
      previousEventBlock.classList.add("hidden");
    });
  </script>
</body>
</html>
