<!DOCTYPE html>
<html lang="ua">
<head>
  <meta charset="UTF-8" />
  <title>Домашня практика</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    label, button { margin: 10px 0; display: block; }
    video, audio { margin-top: 10px; max-width: 100%; }
    .lang-switch { margin-top: 20px; }
  </style>
</head>
<body>

  <h2 id="title">Реєстрація</h2>

  <div class="lang-switch">
    <label>Мова: 
      <select id="langSelect">
        <option value="ua">Українська</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>

  <form id="loginForm">
    <label id="loginLabel">Логін: 
      <input type="text" id="loginInput" required />
    </label>
    <button type="submit" id="submitBtn">Зберегти логін</button>
  </form>

  <p><strong>Збережено в cookie:</strong> <span id="savedLogin">—</span></p>
  <button onclick="clearAll()">Очистити всі дані</button>

  <hr />

  <button id="cameraBtn">Увімкнути камеру</button>
  <video id="video" autoplay playsinline></video>

  <hr />

  <button onclick="document.getElementById('audio').play()">▶️ Відтворити аудіо</button>
  <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" controls></audio>

  <hr />

  <button id="recordBtn">Почати запис</button>
  <video id="recordedVideo" controls></video>

  <script>
    const langSelect = document.getElementById("langSelect");
    const title = document.getElementById("title");
    const loginLabel = document.getElementById("loginLabel");
    const submitBtn = document.getElementById("submitBtn");

    const langText = {
      ua: {
        title: "Реєстрація",
        login: "Логін:",
        button: "Зберегти логін"
      },
      en: {
        title: "Registration",
        login: "Login:",
        button: "Save login"
      }
    };

    function setLanguage(lang) {
      localStorage.setItem("lang", lang);
      title.textContent = langText[lang].title;
      loginLabel.innerHTML = `${langText[lang].login} <input type="text" id="loginInput" required />`;
      submitBtn.textContent = langText[lang].button;
    }

    langSelect.addEventListener("change", (e) => {
      setLanguage(e.target.value);
    });

    // Завантаження мови при старті
    const savedLang = localStorage.getItem("lang") || "ua";
    langSelect.value = savedLang;
    setLanguage(savedLang);

    // Реєстрація з cookie
    const loginForm = document.getElementById("loginForm");
    const savedLogin = document.getElementById("savedLogin");

    function setCookie(name, value, days = 365) {
      const d = new Date();
      d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
      document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
    }

    function getCookie(name) {
      const match = document.cookie.match(new RegExp(`(^| )${name}=([^;]+)`));
      return match ? match[2] : null;
    }

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const loginValue = document.getElementById("loginInput").value;
      setCookie("login", loginValue);
      savedLogin.textContent = loginValue;
    });

    savedLogin.textContent = getCookie("login") || "—";

    // Очистити всі дані
    function clearAll() {
      localStorage.clear();
      document.cookie.split(";").forEach(c => {
        document.cookie = c.trim().split("=")[0] + "=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/";
      });
      alert("Всі дані очищено!");
      location.reload();
    }

    // Камера
    const cameraBtn = document.getElementById("cameraBtn");
    const video = document.getElementById("video");

    cameraBtn.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;

      setTimeout(() => {
        stream.getTracks().forEach(track => track.stop());
      }, 3000);
    };

    // Запис відео
    const recordBtn = document.getElementById("recordBtn");
    const recordedVideo = document.getElementById("recordedVideo");
    let mediaRecorder, chunks = [];

    recordBtn.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      mediaRecorder = new MediaRecorder(stream);
      chunks = [];

      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        recordedVideo.src = URL.createObjectURL(blob);
      };

      mediaRecorder.start();

      setTimeout(() => {
        mediaRecorder.stop();
        stream.getTracks().forEach(track => track.stop());
      }, 5000);
    };
  </script>
</body>
</html>
